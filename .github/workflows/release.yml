name: Build native Windows C application

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mingw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Check build failure, heartbeat and process-tree timeout
        shell: powershell
        run: ./tests/test_build_launcher.ps1
      - name: Compile with MinGW-w64
        shell: msys2 {0}
        run: MSYS2_ARG_CONV_EXCL='*' cmd.exe /c build-windows.bat mingw
      - name: Check extracted source kit with Windows PowerShell 5.1
        shell: msys2 {0}
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/test_source_kit.ps1 -Toolchain mingw
      - name: Check transfer calculations
        shell: msys2 {0}
        run: gcc -std=c17 -Wall -Wextra -Werror tests/test_transfer.c -o build/test_transfer.exe && ./build/test_transfer.exe
      - name: Check hardware database matching
        shell: msys2 {0}
        run: gcc -std=c17 -Wall -Wextra -Werror tests/test_device_db.c native/device_db.c -o build/test_device_db.exe && ./build/test_device_db.exe
      - name: Check installed driver advice and version comparisons
        shell: msys2 {0}
        run: gcc -std=c17 -Wall -Wextra -Werror tests/test_driver_status.c native/driver_status.c -o build/test_driver_status.exe && ./build/test_driver_status.exe
      - name: Check read-only Windows installed driver inventory
        shell: msys2 {0}
        run: gcc -std=c17 -Wall -Wextra -Werror tests/test_installed_driver.c native/installed_driver.c -o build/test_installed_driver.exe -lsetupapi -ladvapi32 && ./build/test_installed_driver.exe
      - name: Check vendor catalog matching
        shell: msys2 {0}
        run: gcc -std=c17 -Wall -Wextra -Werror tests/test_vendor_catalog.c native/vendor_catalog.c -o build/test_vendor_catalog.exe && ./build/test_vendor_catalog.exe
      - name: Check OEM manufacturer and system matching
        shell: msys2 {0}
        run: gcc -std=c17 -Wall -Wextra -Werror tests/test_oem_catalog.c native/oem_catalog.c native/vendor_catalog.c -o build/test_oem_catalog.exe && ./build/test_oem_catalog.exe
      - name: Prepare harmless CAB fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'build/cab test' | Out-Null
          '[Version]' | Set-Content -Encoding ascii 'build/cab test/fixture.inf'
          & "$env:WINDIR/System32/makecab.exe" 'build/cab test/fixture.inf' 'build/cab test/package.cab'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Get-FileHash 'build/cab test/package.cab' -Algorithm SHA256).Hash.ToLower() | Set-Content -Encoding ascii 'build/cab test/hash.txt'
      - name: Check native CAB extraction and EXE execution refusal
        shell: msys2 {0}
        run: gcc -std=c17 -Wall -Wextra -Werror tests/test_vendor_cab.c native/vendor_catalog.c native/vendor_download.c -o build/test_vendor_cab.exe -lwinhttp -lbcrypt -lshlwapi -lshell32 -lole32 && ./build/test_vendor_cab.exe
      - name: Check vendor download and verification
        shell: msys2 {0}
        run: gcc -std=c17 -Wall -Wextra -Werror tests/test_vendor_windows.c native/vendor_catalog.c native/vendor_download.c -o build/test_vendor_windows.exe -lwinhttp -lbcrypt -lshlwapi -lshell32 -lole32 && ./build/test_vendor_windows.exe --online
      - name: Check system diagnostics
        shell: msys2 {0}
        run: gcc -std=c17 -Wall -Wextra -Werror tests/test_diagnostics.c native/update_diagnostics.c -o build/test_diagnostics.exe -lshell32 -ladvapi32 -lole32 && ./build/test_diagnostics.exe
      - name: Check native executable
        shell: pwsh
        run: |
          foreach ($argument in @('--self-test', '--smoke-test')) {
            $process = Start-Process dist/DriverSource.exe -ArgumentList $argument -PassThru
            if (-not $process.WaitForExit(60000)) {
              $process.Kill()
              throw "$argument timed out"
            }
            if ($process.ExitCode -ne 0) { throw "$argument failed with $($process.ExitCode)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: DriverSource-MinGW-Windows-x64
          path: |
            dist/DriverSource.exe
            dist/database/

  windows:
    needs: mingw
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile C with warnings treated as errors
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          cmd /c "call build-windows.bat msvc > build\msvc.log 2>&1"
          $buildExit = $LASTEXITCODE
          Get-Content build/msvc.log
          if ($buildExit -ne 0) {
            $errors = @(Get-Content build/msvc.log | Where-Object { $_ -match 'error C|error LNK|fatal error|warning C' } | Select-Object -First 10)
            if ($errors.Count -eq 0) { $errors = @(Get-Content build/msvc.log | Select-Object -Last 10) }
            foreach ($line in $errors) {
              $escaped = $line.Replace('%', '%25')
              Write-Output "::error::$escaped"
            }
            exit $buildExit
          }
      - name: Check source kit and automatic MSVC initialization
        shell: powershell
        run: ./tests/test_source_kit.ps1 -Toolchain msvc
      - name: Check transfer calculations
        shell: cmd
        run: cl /nologo /TC /std:c17 /W4 /WX /MT tests\test_transfer.c /Fo"build\test_transfer.obj" /Fe"build\test_transfer.exe" && build\test_transfer.exe
      - name: Check hardware database matching
        shell: cmd
        run: cl /nologo /TC /std:c17 /utf-8 /W4 /WX /MT /D_CRT_SECURE_NO_WARNINGS tests\test_device_db.c native\device_db.c /Fobuild\ /Fe"build\test_device_db.exe" && build\test_device_db.exe
      - name: Check installed driver advice and version comparisons
        shell: cmd
        run: cl /nologo /TC /std:c17 /W4 /WX /MT tests\test_driver_status.c native\driver_status.c /Fobuild\ /Fe"build\test_driver_status.exe" && build\test_driver_status.exe
      - name: Check read-only Windows installed driver inventory
        shell: cmd
        run: cl /nologo /TC /std:c17 /W4 /WX /MT tests\test_installed_driver.c native\installed_driver.c /Fobuild\ /Fe"build\test_installed_driver.exe" /link setupapi.lib advapi32.lib && build\test_installed_driver.exe
      - name: Check vendor catalog matching
        shell: cmd
        run: cl /nologo /TC /std:c17 /utf-8 /W4 /WX /MT /D_CRT_SECURE_NO_WARNINGS tests\test_vendor_catalog.c native\vendor_catalog.c /Fobuild\ /Fe"build\test_vendor_catalog.exe" && build\test_vendor_catalog.exe
      - name: Check OEM manufacturer and system matching
        shell: cmd
        run: cl /nologo /TC /std:c17 /utf-8 /W4 /WX /MT /D_CRT_SECURE_NO_WARNINGS tests\test_oem_catalog.c native\oem_catalog.c native\vendor_catalog.c /Fobuild\ /Fe"build\test_oem_catalog.exe" && build\test_oem_catalog.exe
      - name: Prepare harmless CAB fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'build/cab test' | Out-Null
          '[Version]' | Set-Content -Encoding ascii 'build/cab test/fixture.inf'
          & "$env:WINDIR/System32/makecab.exe" 'build/cab test/fixture.inf' 'build/cab test/package.cab'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Get-FileHash 'build/cab test/package.cab' -Algorithm SHA256).Hash.ToLower() | Set-Content -Encoding ascii 'build/cab test/hash.txt'
      - name: Check native CAB extraction and EXE execution refusal
        shell: cmd
        run: cl /nologo /TC /std:c17 /utf-8 /W4 /WX /MT /D_CRT_SECURE_NO_WARNINGS tests\test_vendor_cab.c native\vendor_catalog.c native\vendor_download.c /Fobuild\ /Fe"build\test_vendor_cab.exe" /link winhttp.lib bcrypt.lib shlwapi.lib shell32.lib ole32.lib && build\test_vendor_cab.exe
      - name: Check vendor download and verification
        shell: cmd
        run: cl /nologo /TC /std:c17 /utf-8 /W4 /WX /MT /D_CRT_SECURE_NO_WARNINGS tests\test_vendor_windows.c native\vendor_catalog.c native\vendor_download.c /Fobuild\ /Fe"build\test_vendor_windows.exe" /link winhttp.lib bcrypt.lib shlwapi.lib shell32.lib ole32.lib && build\test_vendor_windows.exe --online
      - name: Check system diagnostics
        shell: cmd
        run: cl /nologo /TC /std:c17 /utf-8 /W4 /WX /MT tests\test_diagnostics.c native\update_diagnostics.c /Fobuild\ /Fe"build\test_diagnostics.exe" /link shell32.lib advapi32.lib ole32.lib && build\test_diagnostics.exe
      - name: Check hardware API and native window startup
        shell: pwsh
        run: |
          foreach ($argument in @('--self-test', '--smoke-test')) {
            $process = Start-Process dist/DriverSource.exe -ArgumentList $argument -PassThru
            if (-not $process.WaitForExit(60000)) {
              $process.Kill()
              throw "$argument timed out"
            }
            if ($process.ExitCode -ne 0) { throw "$argument failed with $($process.ExitCode)" }
          }
          Compress-Archive -Path dist/DriverSource.exe,dist/database,README.md,SOURCES.md -DestinationPath dist/DriverSource-Windows-x64.zip
          $hash = (Get-FileHash dist/DriverSource-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  DriverSource-Windows-x64.zip" | Set-Content -Encoding ascii dist/DriverSource-Windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: DriverSource-native-Windows-x64
          path: |
            dist/DriverSource-Windows-x64.zip
            dist/DriverSource-Windows-x64.zip.sha256
            dist/DriverSource-Source-and-Build.zip
            dist/DriverSource-Source-and-Build.zip.sha256
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/DriverSource-Windows-x64.zip dist/DriverSource-Windows-x64.zip.sha256 dist/DriverSource-Source-and-Build.zip dist/DriverSource-Source-and-Build.zip.sha256 --title "驱动源 ${{ github.ref_name }} · C 原生版" --notes-file CHANGELOG.md
