name: Build Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate download engine
        run: python -m unittest discover -s tests -v
      - name: Validate Windows desktop startup
        run: |
          @'
          import tkinter as tk
          from desktop import Application
          root = tk.Tk()
          app = Application(root)
          root.update()
          assert len(app.source_tree.get_children()) == 20
          app.show_devices({"schemaVersion": 1, "devices": [{"name": "Test GPU", "ids": ["PCI\\VEN_10DE&DEV_1234"]}]})
          assert len(app.hardware_tree.get_children()) == 1
          root.destroy()
          '@ | python -
      - name: Build desktop executable
        run: |
          python -m pip install pyinstaller==6.11.1
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name DriverSource --add-data "sources.js;." desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: DriverSource-Windows
          path: dist/DriverSource.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/DriverSource.exe --title "驱动源 ${{ github.ref_name }}" --notes-file CHANGELOG.md
