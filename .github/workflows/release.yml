name: Build native Windows C application

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mingw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Compile with MinGW-w64
        shell: msys2 {0}
        run: MSYS2_ARG_CONV_EXCL='*' cmd.exe /c build-windows.bat mingw
      - name: Check transfer calculations
        shell: msys2 {0}
        run: gcc -std=c17 -Wall -Wextra -Werror tests/test_transfer.c -o build/test_transfer.exe && ./build/test_transfer.exe
      - name: Check hardware database matching
        shell: msys2 {0}
        run: gcc -std=c17 -Wall -Wextra -Werror tests/test_device_db.c native/device_db.c -o build/test_device_db.exe && ./build/test_device_db.exe
      - name: Check Windows Update callback interfaces
        shell: msys2 {0}
        run: gcc -std=c17 -Wall -Wextra -Werror tests/test_wua_callbacks.c native/wua_callbacks.c -o build/test_wua_callbacks.exe -lole32 -loleaut32 -luuid && ./build/test_wua_callbacks.exe
      - name: Check native executable
        shell: pwsh
        run: |
          foreach ($argument in @('--self-test', '--smoke-test')) {
            $process = Start-Process dist/DriverSource.exe -ArgumentList $argument -PassThru
            if (-not $process.WaitForExit(60000)) {
              $process.Kill()
              throw "$argument timed out"
            }
            if ($process.ExitCode -ne 0) { throw "$argument failed with $($process.ExitCode)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: DriverSource-MinGW-Windows-x64
          path: |
            dist/DriverSource.exe
            dist/database/

  windows:
    needs: mingw
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile C with warnings treated as errors
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          cmd /c "call build-windows.bat msvc > build\msvc.log 2>&1"
          $buildExit = $LASTEXITCODE
          Get-Content build/msvc.log
          if ($buildExit -ne 0) {
            $errors = @(Get-Content build/msvc.log | Where-Object { $_ -match 'error C|error LNK|fatal error|warning C' } | Select-Object -First 10)
            if ($errors.Count -eq 0) { $errors = @(Get-Content build/msvc.log | Select-Object -Last 10) }
            foreach ($line in $errors) {
              $escaped = $line.Replace('%', '%25')
              Write-Output "::error::$escaped"
            }
            exit $buildExit
          }
      - name: Check transfer calculations
        shell: cmd
        run: cl /nologo /TC /std:c17 /W4 /WX /MT tests\test_transfer.c /Fo"build\test_transfer.obj" /Fe"build\test_transfer.exe" && build\test_transfer.exe
      - name: Check hardware database matching
        shell: cmd
        run: cl /nologo /TC /std:c17 /utf-8 /W4 /WX /MT /D_CRT_SECURE_NO_WARNINGS tests\test_device_db.c native\device_db.c /Fobuild\ /Fe"build\test_device_db.exe" && build\test_device_db.exe
      - name: Check Windows Update callback interfaces
        shell: cmd
        run: cl /nologo /TC /std:c17 /W4 /WX /MT tests\test_wua_callbacks.c native\wua_callbacks.c /Fobuild\ /Fe"build\test_wua_callbacks.exe" /link ole32.lib oleaut32.lib uuid.lib && build\test_wua_callbacks.exe
      - name: Check hardware API and native window startup
        shell: pwsh
        run: |
          foreach ($argument in @('--self-test', '--smoke-test')) {
            $process = Start-Process dist/DriverSource.exe -ArgumentList $argument -PassThru
            if (-not $process.WaitForExit(60000)) {
              $process.Kill()
              throw "$argument timed out"
            }
            if ($process.ExitCode -ne 0) { throw "$argument failed with $($process.ExitCode)" }
          }
          Compress-Archive -Path dist/DriverSource.exe,dist/database,README.md,SOURCES.md -DestinationPath dist/DriverSource-Windows-x64.zip
          $hash = (Get-FileHash dist/DriverSource-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  DriverSource-Windows-x64.zip" | Set-Content -Encoding ascii dist/DriverSource-Windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: DriverSource-native-Windows-x64
          path: |
            dist/DriverSource-Windows-x64.zip
            dist/DriverSource-Windows-x64.zip.sha256
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/DriverSource-Windows-x64.zip dist/DriverSource-Windows-x64.zip.sha256 --title "驱动源 ${{ github.ref_name }} · C 原生版" --notes-file CHANGELOG.md
